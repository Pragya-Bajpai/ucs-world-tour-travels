
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | UCS World Tour & Travels</title>
    <meta name="description" content="Reset your UCS World Tour & Travels account password securely.">

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/loader.css">
    <style>
        :root {
            --ucs-navy: #07123d;
            --ucs-red: #ff0000;
            --ucs-blue: #1769aa;
            --ucs-text: #17213b;
            --ucs-muted: #718096;
            --ucs-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            color: var(--ucs-text);
        }

        .forgot-section {
            min-height: 600px;
            padding: 65px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .forgot-container {
            width: 100%;
            max-width: 1000px;
            min-height: 480px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 45px rgba(7, 18, 61, 0.10);
        }

        /* Left Banner */
        .forgot-banner {
            position: relative;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #fff;
            background:
                linear-gradient(135deg, rgba(7,18,61,.94), rgba(7,18,61,.55)),
                url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1000&q=85');
            background-size: cover;
            background-position: center;
        }

        .forgot-banner h2 {
            font-size: 33px;
            line-height: 1.35;
            font-weight: 800;
            margin: 0 0 17px;
        }

        .forgot-banner h2 span {
            color: #ff4545;
        }

        .forgot-banner p {
            color: rgba(255,255,255,.85);
            font-size: 14px;
            line-height: 1.8;
            margin: 0;
        }

        .forgot-banner-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background: rgba(255,255,255,.15);
            font-size: 27px;
            margin-bottom: 25px;
        }

        .banner-note {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: rgba(255,255,255,.9);
        }

        .banner-note i {
            color: #ff5555;
            font-size: 18px;
        }

        /* Right Form */
        .forgot-form-area {
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .forgot-logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .forgot-logo img {
            max-width: 175px;
            max-height: 65px;
            object-fit: contain;
        }

        .forgot-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .forgot-heading h1 {
            color: var(--ucs-navy);
            font-size: 27px;
            font-weight: 800;
            margin: 0 0 12px;
        }

        .forgot-heading p {
            color: var(--ucs-muted);
            font-size: 13px;
            line-height: 1.8;
            margin: 0;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: var(--ucs-text);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8a96aa;
            font-size: 15px;
        }

        .form-control {
            width: 100%;
            height: 48px;
            padding: 0 15px 0 45px;
            border: 1px solid var(--ucs-border);
            border-radius: 8px;
            outline: none;
            color: var(--ucs-text);
            font-size: 14px;
            font-family: inherit;
            transition: .2s ease;
        }

        .form-control:focus {
            border-color: var(--ucs-blue);
            box-shadow: 0 0 0 3px rgba(23,105,170,.09);
        }

        .reset-btn {
            width: 100%;
            height: 43px;
            border: none;
            border-radius: 7px;
             background: linear-gradient(135deg, #07123d 0%, #1769aa 55%, #ff0000 100%);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s ease;
        }

        .reset-btn:hover {
             background: linear-gradient(135deg, #ff0000 0%, #1769aa 55%, #07123d 100%);
    color: #ffffff;
    transform: translateY(-2px);
        }

        .reset-btn i {
            margin-left: 7px;
        }

        .back-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 25px;
            color: var(--ucs-muted);
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
            transition: .2s ease;
        }

        .back-login:hover {
            color: var(--ucs-red);
        }

        .form-message {
            display: none;
            padding: 11px 13px;
            margin-bottom: 18px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.6;
        }

        .form-message.error {
            display: block;
            background: #fff0f0;
            color: #c62828;
        }

        .form-message.success {
            display: block;
            background: #edfff3;
            color: #187a3b;
        }

        @media (max-width: 768px) {
            .forgot-section {
                padding: 35px 15px;
            }

            .forgot-container {
                max-width: 500px;
                grid-template-columns: 1fr;
            }

            .forgot-banner {
                min-height: 220px;
                padding: 30px 25px;
            }

            .forgot-banner h2 {
                font-size: 25px;
            }

            .forgot-banner-icon {
                width: 48px;
                height: 48px;
                font-size: 21px;
                margin-bottom: 15px;
            }

            .banner-note {
                margin-top: 25px;
            }

            .forgot-form-area {
                padding: 38px 25px;
            }
        }

        @media (max-width: 400px) {
            .forgot-form-area {
                padding: 32px 18px;
            }

            .forgot-heading h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <main>
        <section class="forgot-section">

            <div class="forgot-container">

                <!-- Left Banner -->
                <div class="forgot-banner">

                    <div>
                        <div class="forgot-banner-icon">
                            <i class="fa-solid fa-lock"></i>
                        </div>

                        <h2>
                            Forgot Your
                            <span>Password?</span>
                        </h2>

                        <p>
                            Don't worry! It happens to everyone.
                            Enter your registered email address and
                            follow the instructions to reset your password.
                        </p>
                    </div>

                    <div class="banner-note">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Your account security is our priority.</span>
                    </div>

                </div>

                <!-- Reset Form -->
                <div class="forgot-form-area">

                    <div class="forgot-logo">
                        <a href="index.html">
                            <img src="assets/images/logo-dark.png"
                                 alt="UCS World Tour & Travels">
                        </a>
                    </div>

                    <div class="forgot-heading">
                        <h1>Reset Password</h1>
                        <p>
                            Enter your registered email address.
                            We'll help you get back into your account.
                        </p>
                    </div>

                    <div id="formMessage" class="form-message"></div>

                    <form id="forgotForm">

                        <div class="form-group">
                            <label for="email">Email Address</label>

                            <div class="input-wrap">
                                <i class="fa-regular fa-envelope"></i>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter your registered email"
                                    autocomplete="email"
                                    required>
                            </div>
                        </div>

                        <button type="submit" class="reset-btn">
                            Send Reset Link
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>

                    </form>

                    <a href="login.html" class="back-login">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to Login
                    </a>

                </div>

            </div>

        </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <script>
        // Load Shared Header
        fetch("includes/header.html")
            .then(response => {
                if (!response.ok) throw new Error("Header not found");
                return response.text();
            })
            .then(data => {
                document.getElementById("header").innerHTML = data;
            })
            .catch(error => console.error("Header loading error:", error));

        // Load Shared Footer
        fetch("includes/footer.html")
            .then(response => {
                if (!response.ok) throw new Error("Footer not found");
                return response.text();
            })
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            })
            .catch(error => console.error("Footer loading error:", error));

        // Forgot Password Form Validation
        document.getElementById("forgotForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("formMessage");

            message.className = "form-message";

            if (!email) {
                message.textContent = "Please enter your registered email address.";
                message.classList.add("error");
                return;
            }

            message.textContent = "Password reset functionality is not connected yet. Please connect the reset password API.";
            message.classList.add("success");
        });
    </script>
<script src="assets/js/loader.js"></script>
</body>
</html>
