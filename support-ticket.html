
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support Tickets | UCS World Tour & Travels</title>
    <meta name="description" content="Manage your support tickets with UCS World Tour & Travels.">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        .support-page {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
        }

        .support-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .support-heading h1 {
            font-size: 26px;
            font-weight: 700;
            color: #071b49;
            margin: 0 0 7px;
        }

        .support-heading p {
            color: #7c8799;
            font-size: 13px;
            margin: 0;
        }

        .support-summary {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 15px;
            border: 1px solid #e8ecf3;
            border-radius: 7px;
            background: #fff;
            color: #071b49;
            font-size: 12px;
            font-weight: 600;
        }

        .support-summary i {
            color: #ed101b;
        }

        .support-card {
            background: #fff;
            border: 1px solid #e8ecf3;
            border-radius: 11px;
            overflow: hidden;
            box-shadow: 0 5px 22px rgba(7, 27, 73, .045);
        }

        .support-card-header {
            padding: 20px 23px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #e8ecf3;
        }

        .support-card-header h3 {
            color: #071b49;
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 5px;
        }

        .support-card-header p {
            color: #8993a3;
            font-size: 12px;
            margin: 0;
        }

        .support-table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        .support-table {
            width: 100%;
            min-width: 700px;
            border-collapse: collapse;
        }

        .support-table thead {
            background: #071b49;
        }

        .support-table th {
            color: #fff;
            text-align: left;
            padding: 17px 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .support-table td {
            padding: 19px 20px;
            border-bottom: 1px solid #edf0f5;
            font-size: 13px;
            color: #536078;
            white-space: nowrap;
        }

        .support-table tbody tr {
            transition: background .2s;
        }

        .support-table tbody tr:hover {
            background: #fafbfe;
        }

        .support-topic {
            color: #071b49 !important;
            font-weight: 700;
        }

        .support-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 30px;
            background: #e8f7ed;
            color: #16864a;
            font-size: 11px;
            font-weight: 700;
        }

        .support-status::before {
            content: "";
            height: 6px;
            width: 6px;
            border-radius: 50%;
            background: #16864a;
        }

        .support-status.closed {
            background: #eef1f5;
            color: #667085;
        }

        .support-status.closed::before {
            background: #667085;
        }

        .support-view-btn {
            height: 35px;
            padding: 0 15px;
            border: 0;
            border-radius: 5px;
            background: #071b49;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        .support-view-btn:hover {
            background: #ed101b;
        }

        .support-view-btn i {
            margin-right: 5px;
        }

        .support-card-footer {
            padding: 18px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .support-card-footer p {
            font-size: 12px;
            color: #8993a3;
        }

        .support-add-btn {
            height: 42px;
            padding: 0 18px;
            border: 0;
            border-radius: 6px;
            background: #ed101b;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .2s;
        }

        .support-add-btn:hover {
            background: #c9000b;
            transform: translateY(-1px);
        }

        /* MODAL */

        .support-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 17, 43, .58);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .support-modal-overlay.show {
            display: flex;
        }

        .support-modal {
            background: #fff;
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 11px;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }

        .support-modal-header {
            background: #071b49;
            color: #fff;
            padding: 20px 23px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .support-modal-header h3 {
            font-size: 17px;
            margin: 0 0 5px;
        }

        .support-modal-header p {
            color: #cbd5e1;
            font-size: 11px;
        }

        .support-modal-close {
            height: 33px;
            width: 33px;
            border: 1px solid rgba(255,255,255,.3);
            background: transparent;
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .support-modal-body {
            padding: 23px;
        }

        .support-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .support-form-group {
            min-width: 0;
        }

        .support-form-group.full {
            grid-column: 1 / -1;
        }

        .support-form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #344158;
            margin-bottom: 8px;
        }

        .support-form-group label span {
            color: #ed101b;
        }

        .support-form-group input,
        .support-form-group select,
        .support-form-group textarea {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #dfe4ed;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            color: #26334a;
            background: #fff;
        }

        .support-form-group textarea {
            height: 105px;
            padding: 12px;
            resize: vertical;
        }

        .support-form-group input:focus,
        .support-form-group select:focus,
        .support-form-group textarea:focus {
            border-color: #071b49;
            box-shadow: 0 0 0 3px rgba(7,27,73,.06);
        }

        .support-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #e8ecf3;
        }

        .support-cancel-btn,
        .support-submit-btn {
            height: 40px;
            padding: 0 18px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .support-cancel-btn {
            background: #fff;
            border: 1px solid #dfe4ed;
            color: #536078;
        }

        .support-submit-btn {
            background: #ed101b;
            color: #fff;
            border: 1px solid #ed101b;
        }

        .support-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .support-detail small {
            display: block;
            font-size: 11px;
            color: #8993a3;
            margin-bottom: 7px;
        }

        .support-detail strong {
            font-size: 13px;
            color: #071b49;
            overflow-wrap: anywhere;
        }

        .support-description {
            grid-column: 1 / -1;
            background: #f6f8fc;
            border: 1px solid #e8ecf3;
            padding: 15px;
            border-radius: 7px;
        }

        .support-description p {
            font-size: 13px;
            line-height: 1.7;
            color: #536078;
            margin-top: 8px;
        }

        @media(max-width: 650px) {
            .support-heading {
                align-items: flex-start;
            }

            .support-heading h1 {
                font-size: 22px;
            }

            .support-summary {
                display: none;
            }

            .support-card-header {
                padding: 16px;
            }

            .support-card-footer {
                padding: 15px;
                align-items: flex-start;
                flex-direction: column;
            }

            .support-add-btn {
                width: 100%;
            }

            .support-form-grid,
            .support-details-grid {
                grid-template-columns: 1fr;
            }

            .support-form-group.full,
            .support-description {
                grid-column: auto;
            }

            .support-modal-body {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="account-layout">

        <!-- EXISTING DASHBOARD HEADER -->
        <div id="accountHeader"></div>

        <!-- EXISTING DASHBOARD SIDEBAR -->
        <div id="accountSidebarContainer"></div>

        <!-- SUPPORT TICKET MAIN CONTENT -->
        <main class="account-main">

            <div class="support-page">

                <div class="support-heading">
                    <div>
                        <h1>Support Ticket</h1>
                        <p>Manage your queries and get assistance from our support team.</p>
                    </div>

                    <div class="support-summary">
                        <i class="fa-solid fa-ticket"></i>
                        <span id="supportCount">1 Ticket</span>
                    </div>
                </div>

                <section class="support-card">

                    <div class="support-card-header">
                        <div>
                            <h3>My Support Tickets</h3>
                            <p>Track and manage your submitted support requests.</p>
                        </div>
                    </div>

                    <div class="support-table-wrap">
                        <table class="support-table">
                            <thead>
                                <tr>
                                    <th>Topic</th>
                                    <th>Submission date</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody id="supportTableBody">
                                <tr>
                                    <td class="support-topic">test</td>
                                    <td>2026-09-09 04:53 AM</td>
                                    <td>Website problem</td>
                                    <td>
                                        <span class="support-status">Open</span>
                                    </td>
                                    <td>
                                        <button class="support-view-btn"
                                            data-topic="test"
                                            data-date="2026-09-09 04:53 AM"
                                            data-type="Website problem"
                                            data-status="Open"
                                            data-description="Website problem">
                                            <a href="support-ticket-view.html" class="view-ticket-btn">
    <i class="fa-regular fa-eye"></i> View
</a>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="support-card-footer">
                        <p>Showing <strong id="supportShowing">1</strong> support ticket</p>

                        <button type="button" class="support-add-btn" id="addSupportTicket">
                            <i class="fa-solid fa-plus"></i>
                            Add New Ticket
                        </button>
                    </div>

                </section>

            </div>

        </main>
    </div>


    

 
    
    <!-- EXISTING ACCOUNT LAYOUT JS -->
    <script src="assets/js/account-layout.js"></script>

  
    

</body>
</html>
